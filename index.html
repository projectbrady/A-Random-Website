<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>LOGIN NOW</title>
  </head>
  <body>
    <div class="main-container" id="main-container">
      <form action="#" class="form" id="login">
        <h1>Log In</h1>
        <!-- Log In Form -->
        <label for="email" required></label>
        <input
          type="emaillog"
          id="emaillog"
          name="emaillog"
          placeholder="John.Doe@email.com"
        />
        <label for="password" required> </label>
        <input
          type="password"
          id="psword"
          name="psword"
          placeholder="**********"
        />

        <input type="submit" value="Log In" />
      </form>
      <form action="#" class="form" id="signup">
        <h1>Create Accout</h1>
        <!-- Sign Up Form -->
        <label for="fname" required></label>
        <input
          type="text"
          id="fname"
          name="fname"
          placeholder="First Name..."
        />

        <label for="lname" required></label>
        <input type="text" id="lname" name="lname" placeholder="Last Name..." />

        <label for="email" required></label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="John.Doe@email.com"
        />

        <label for="password" required> </label>
        <input
          type="password"
          id="psword"
          name="psword"
          placeholder="**********"
        />

        <input type="submit" value="Sign Up" />
      </form>
    </div>
  </body>
  <style src="script.js"></style>
</html>
